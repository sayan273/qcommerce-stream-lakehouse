version: 2

sources:
  - name: raw_data
    database: warehouse
    schema: public
    tables:
      - name: raw_orders
      - name: raw_users

models:
  - name: stg_orders
    description: "Cleaned and standardized order event records with status and payment tracking."
    columns:
      - name: order_id
        description: "Primary key UUID generated for the order event."
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null
          - assert_valid_order_metrics
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['SUCCESS', 'FAILED', 'PENDING']